<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fes seguiment de la teva biblioteca de videojocs, escriu reviews i comparteix la teva activitat amb amics.">
  <meta name="theme-color" content="#8B5CF6">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GameShelf">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GameShelf</title>
  <link rel="manifest" href="manifest.json">

  <!-- Captura l'esdeveniment natiu d'instal·lació PWA (Android/Chrome/Edge)
       perquè l'app pugui oferir un botó propi "Instal·la l'app" en lloc de
       dependre que l'usuari trobi l'opció amagada al menú del navegador. -->
  <script>
    window.gsDeferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.gsDeferredInstallPrompt = event;
    });

    window.gsInstallAvailable = function () {
      return window.gsDeferredInstallPrompt !== null;
    };

    window.gsPromptInstall = async function () {
      if (!window.gsDeferredInstallPrompt) return false;
      window.gsDeferredInstallPrompt.prompt();
      const choice = await window.gsDeferredInstallPrompt.userChoice;
      window.gsDeferredInstallPrompt = null;
      return choice.outcome === 'accepted';
    };

    window.gsIsStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
